name: ci

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# typecheck / test 运行时需要的占位配置,任意值即可(不连真实 DB)。
env:
  DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci
  JWT_SECRET: ci_dummy_secret_long_enough_to_pass_validation

jobs:
  lint-format:
    name: lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: bun run check:brand-contract
      - run: bun run check:release-contract
      - run: bun run test:release-metadata
      - run: bun run format:check
      - run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          prisma: 'true'
      - run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          prisma: 'true'
      - run: bun run --cwd backend test

  firmware-host-test:
    name: firmware host contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: cmake -S firmware/host_tests -B "$RUNNER_TEMP/firmware-host-tests"
      - run: cmake --build "$RUNNER_TEMP/firmware-host-tests"
      - run: ctest --test-dir "$RUNNER_TEMP/firmware-host-tests" --output-on-failure

  frontend-build:
    name: frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: bun run --cwd frontend build
