name: firmware

on:
  push:
    branches: [master]
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:

jobs:
  build:
    name: ESP-IDF build (${{ matrix.board_id }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board_id: zectrix-note4
            target: esp32s3
    steps:
      - uses: actions/checkout@v6

      - name: ESP-IDF build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: 'v5.5.2'
          target: ${{ matrix.target }}
          path: 'firmware'
          command: >-
            BOARD_SDKCONFIG_DEFAULTS="/tmp/slate-sdkconfig.${{ matrix.board_id }}.defaults" &&
            printf "CONFIG_SLATE_BOARD_ID=\"${{ matrix.board_id }}\"\n" > "$BOARD_SDKCONFIG_DEFAULTS" &&
            idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;$BOARD_SDKCONFIG_DEFAULTS" build &&
            idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;$BOARD_SDKCONFIG_DEFAULTS" merge-bin -o "slate-${{ matrix.board_id }}-full.bin" &&
            cp build/slate.bin "build/slate-${{ matrix.board_id }}-ota.bin"

      - name: upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.board_id }}
          path: |
            firmware/build/slate-${{ matrix.board_id }}-full.bin
            firmware/build/slate-${{ matrix.board_id }}-ota.bin
          if-no-files-found: error
          retention-days: 14
